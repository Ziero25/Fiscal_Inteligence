<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Tópico Fiscal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .topic-detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .back-link:hover { color: #1d4ed8; }
        .topic-detail-title {
            font-size: 2rem;
            margin-bottom: 15px;
            line-height: 1.3;
            color: #0f172a;
        }
        .topic-detail-meta {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .topic-detail-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 40px;
            white-space: pre-wrap;
        }
        .btn-source {
            display: inline-block;
            background: #f1f5f9;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .btn-source:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo" style="text-decoration: none;">
                <div class="logo-icon">⚡</div>
                <span class="logo-text"><span class="logo-bold">Fiscal</span><span class="logo-light">Intelligence</span></span>
            </a>
            <div class="header-right">
                <a href="index.html" style="color: #94a3b8; text-decoration: none; margin-right: 20px; font-weight: 500;">Início</a>
                <a href="dashboard.html" style="color: #94a3b8; text-decoration: none; font-weight: 500;">Portal</a>
            </div>
        </div>
    </header>

    <main class="content-wrapper" style="display: block; margin-top: 80px;">
        <div class="topic-detail-container">
            <a href="dashboard.html" class="back-link">← Voltar para o Portal</a>
            <div id="topicDetail">
                <p>Carregando detalhes do tópico...</p>
            </div>
        </div>
    </main>

    <script src="topic.js"></script>
</body>
</html>
